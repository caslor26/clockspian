<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Uppsala — Clock &amp; Weather</title>
<style>
  :root{
    --bg:#0f1416;
    --bg-2:#141b1e;
    --line:#26312f;
    --fg:#f4f2ea;
    --fg-dim:#8a9490;
    --accent:#c9b28a;
    --accent-2:#5c7a70;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:var(--bg);
    color:var(--fg);
    font-family:'Helvetica Neue',Arial,sans-serif;
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:100vw;height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:
      radial-gradient(circle at 15% 85%, rgba(92,122,112,0.16), transparent 55%),
      radial-gradient(circle at 85% 15%, rgba(201,178,138,0.10), transparent 50%),
      var(--bg);
  }

  /* faint structural grid — quiet, not decorative-for-its-own-sake */
  .grid-line{
    position:absolute;
    background:var(--line);
    opacity:0.5;
  }
  .grid-line.h{ left:0; right:0; height:1px; }
  .grid-line.v{ top:0; bottom:0; width:1px; }

  .center{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(18px, 3vh, 34px);
    z-index:2;
  }

  .time{
    font-size:clamp(72px, 15vw, 190px);
    font-weight:200;
    letter-spacing:-0.02em;
    line-height:1;
    font-variant-numeric:tabular-nums;
    color:var(--fg);
  }
  .time .colon{
    display:inline-block;
    color:var(--accent);
    animation:blink 2s steps(1) infinite;
    padding:0 0.02em;
  }
  @keyframes blink{ 0%,45%{opacity:1;} 50%,95%{opacity:0.15;} 100%{opacity:1;} }

  .date-row{
    display:flex;
    align-items:center;
    gap:16px;
    font-size:clamp(13px,1.6vw,18px);
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:var(--fg-dim);
  }
  .date-row .dot{
    width:5px;height:5px;
    border-radius:50%;
    background:var(--accent-2);
  }

  .divider{
    width:1px;
    height:clamp(28px,5vh,56px);
    background:linear-gradient(var(--line), transparent);
  }

  .weather{
    display:flex;
    align-items:center;
    gap:clamp(20px,3vw,40px);
  }

  /* geometric glyph built from primitive shapes, no icon font */
  .glyph{ width:56px; height:56px; position:relative; flex-shrink:0; }
  .glyph .sun{
    position:absolute; inset:10px;
    border-radius:50%;
    background:var(--accent);
    opacity:0.9;
  }
  .glyph .ring{
    position:absolute; inset:0;
    border-radius:50%;
    border:1px solid var(--accent);
    opacity:0.25;
  }

  .temp-block{
    display:flex;
    align-items:baseline;
    gap:6px;
  }
  .temp{
    font-size:clamp(40px,6vw,64px);
    font-weight:300;
    letter-spacing:-0.01em;
  }
  .unit{
    font-size:clamp(18px,2.2vw,26px);
    color:var(--fg-dim);
    font-weight:300;
  }

  .condition-block{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .condition{
    font-size:clamp(14px,1.7vw,19px);
    color:var(--fg);
    letter-spacing:0.02em;
  }
  .place{
    font-size:clamp(11px,1.3vw,14px);
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--fg-dim);
  }

  .range{
    display:flex;
    gap:14px;
    font-size:clamp(12px,1.4vw,15px);
    color:var(--fg-dim);
    letter-spacing:0.04em;
  }
  .range .hi{ color:var(--accent); }

  /* corner marks — minimal structural signature */
  .corner{
    position:absolute;
    width:22px;height:22px;
    z-index:2;
  }
  .corner::before, .corner::after{
    content:'';
    position:absolute;
    background:var(--fg-dim);
    opacity:0.4;
  }
  .corner::before{ width:100%; height:1px; top:0; }
  .corner::after{ width:1px; height:100%; left:0; }
  .tl{ top:36px; left:36px; }
  .tr{ top:36px; right:36px; transform:scaleX(-1); }
  .bl{ bottom:36px; left:36px; transform:scaleY(-1); }
  .br{ bottom:36px; right:36px; transform:scale(-1,-1); }

  .seconds-track{
    position:absolute;
    bottom:0; left:0;
    height:2px;
    background:var(--accent-2);
    opacity:0.55;
    transition:width 1s linear;
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="center">
      <div class="time" id="time">--<span class="colon">:</span>--</div>

      <div class="date-row">
        <span id="weekday">—</span>
        <span class="dot"></span>
        <span id="date">—</span>
      </div>

      <div class="divider"></div>

      <div class="weather">
        <div class="glyph">
          <div class="ring"></div>
          <div class="sun"></div>
        </div>
        <div class="temp-block">
          <div class="temp" id="temp">21</div>
          <div class="unit">°C</div>
        </div>
        <div class="condition-block">
          <div class="condition" id="condition">Mostly sunny</div>
          <div class="place">Uppsala, Sweden</div>
          <div class="range">
            <span class="hi" id="hi">H 22°</span>
            <span id="lo">L 14°</span>
          </div>
        </div>
      </div>
    </div>

    <div class="seconds-track" id="secondsTrack"></div>
  </div>

<script>
  // Weather fetched at build time (Aimo Park meeting-friendly, static — no live API call from artifact sandbox)
  const weekdays = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function pad(n){ return n.toString().padStart(2,'0'); }

  function tick(){
    const now = new Date();
    document.getElementById('time').innerHTML =
      pad(now.getHours()) + '<span class="colon">:</span>' + pad(now.getMinutes());
    document.getElementById('weekday').textContent = weekdays[now.getDay()];
    document.getElementById('date').textContent = months[now.getMonth()] + ' ' + now.getDate();

    const secondsPct = (now.getSeconds() / 60) * 100;
    document.getElementById('secondsTrack').style.width = secondsPct + '%';
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
