<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clockspian - A clock by Caspian</title>
<meta name="color-scheme" content="light">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="stage">
    <div class="center">
      <div class="time" id="time">--<span class="colon">:</span>--</div>

      <div class="date-row">
        <span id="weekday">—</span>
        <span class="dot"></span>
        <span id="date">—</span>
      </div>

      <div class="divider"></div>

      <div class="weather" id="weather">
        <div class="glyph" id="glyph"></div>
        <div class="temp-block">
          <div class="temp" id="temp">--</div>
          <div class="unit">°C</div>
        </div>
        <div class="condition-block">
          <div class="condition" id="condition">—</div>
          <div class="place" id="place">Uppsala, Sweden</div>
          <div class="range">
            <span class="hi" id="hi">H --°</span>
            <span id="lo">L --°</span>
          </div>
        </div>
        <div class="stale-dot" id="staleDot" title="Showing last known reading"></div>
      </div>
    </div>

    <div class="seconds-track" id="secondsTrack"></div>

    <div class="brandmark">
      <!-- Kal Studio mark, redrawn as vectors from the brand artwork so it takes the theme's colours -->
      <svg class="brandmark-logo" viewBox="0 0 441 339" aria-hidden="true">
        <polyline points="14,255 136,91 230,174 326,20 427,255" fill="none" stroke="var(--fg)" stroke-width="27.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="197" cy="29" r="27.5" fill="var(--fg)"/>
        <g fill="var(--accent-2)">
          <circle cx="69.5" cy="307.3" r="11.5"/>
          <circle cx="149.6" cy="321.5" r="7.5"/>
          <circle cx="225.2" cy="326.2" r="11.5"/>
          <circle cx="300.6" cy="321.5" r="7.5"/>
          <circle cx="380.9" cy="307.3" r="11.5"/>
        </g>
      </svg>
      <span class="brandmark-kal">Kal</span>
      <span class="brandmark-studio">Studio</span>
      <span class="brandmark-dot">·</span>
      <span class="brandmark-app">Clockspian</span>
    </div>

    <button class="settings-toggle" id="settingsToggle" aria-label="Settings" aria-expanded="false">
      <!-- "settings" from Lucide (lucide.dev), ISC licence -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </div>

  <aside class="panel" id="panel" aria-label="Settings" hidden>
    <h2 class="panel-title">Display</h2>

    <section class="field">
      <span class="field-label">Light / dark
        <button class="mode-switch" id="modeSwitch" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
          <i class="mode-knob"></i>
          <!-- "sun" and "moon" from Lucide (lucide.dev), ISC licence -->
          <svg class="mode-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
          </svg>
          <svg class="mode-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        </button>
      </span>
    </section>

    <section class="field">
      <label class="field-label" for="scaleInput">Scale <span class="field-value" id="scaleValue">100%</span></label>
      <input type="range" id="scaleInput" min="0.5" max="1.5" step="0.05" value="1">
    </section>

    <section class="field">
      <span class="field-label">Blinking colon
        <button class="switch" id="blinkSwitch" type="button" role="switch" aria-checked="true" aria-label="Blinking colon"><i></i></button>
      </span>
    </section>

    <section class="field">
      <span class="field-label">Minute progress bar
        <button class="switch" id="barSwitch" type="button" role="switch" aria-checked="true" aria-label="Minute progress bar"><i></i></button>
      </span>
    </section>

    <h2 class="panel-title">Theme</h2>

    <section class="field">
      <div class="choices" id="themeChoices" role="radiogroup" aria-label="Theme"></div>
    </section>

    <h2 class="panel-title">Weather</h2>

    <section class="field">
      <span class="field-label">Show weather
        <button class="switch" id="weatherSwitch" type="button" role="switch" aria-checked="true" aria-label="Show weather"><i></i></button>
      </span>
    </section>

    <section class="field" id="locationField">
      <span class="field-label">Location</span>
      <div class="choices" id="locationChoices" role="radiogroup" aria-label="Weather location"></div>
      <p class="field-note" id="locationNote" aria-live="polite" hidden></p>
    </section>

    <button class="reset" id="resetButton">Reset</button>
  </aside>

  <script type="module" src="js/main.js"></script>
</body>
</html>
