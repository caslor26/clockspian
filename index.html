<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uppsala — Clock &amp; Weather</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f1416'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23c9b28a' stroke-width='1.5' opacity='.35'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23c9b28a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="stage">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="center">
      <div class="time" id="time">--<span class="colon">:</span>--</div>

      <div class="date-row">
        <span id="weekday">—</span>
        <span class="dot"></span>
        <span id="date">—</span>
      </div>

      <div class="divider"></div>

      <div class="weather" id="weather">
        <div class="glyph" id="glyph"></div>
        <div class="temp-block">
          <div class="temp" id="temp">--</div>
          <div class="unit">°C</div>
        </div>
        <div class="condition-block">
          <div class="condition" id="condition">—</div>
          <div class="place">Uppsala, Sweden</div>
          <div class="range">
            <span class="hi" id="hi">H --°</span>
            <span id="lo">L --°</span>
          </div>
        </div>
        <div class="stale-dot" id="staleDot" title="Showing last known reading"></div>
      </div>
    </div>

    <div class="seconds-track" id="secondsTrack"></div>

    <div class="brandmark">Clockspian - A Clock by Kal Studio</div>

    <button class="settings-toggle" id="settingsToggle" aria-label="Settings" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>

  <aside class="panel" id="panel" aria-label="Settings" hidden>
    <h2 class="panel-title">Display</h2>

    <section class="field">
      <label class="field-label" for="scaleInput">Scale <span class="field-value" id="scaleValue">100%</span></label>
      <input type="range" id="scaleInput" min="0.7" max="1.6" step="0.05" value="1">
    </section>

    <section class="field">
      <span class="field-label">Kal Studio
        <button class="switch" id="kalSwitch" type="button" role="switch" aria-checked="false" aria-label="Kal Studio design"><i></i></button>
      </span>
    </section>

    <section class="field" id="kalModeField" hidden>
      <span class="field-label">Palette</span>
      <div class="choices" id="kalModeChoices" role="radiogroup" aria-label="Kal Studio palette"></div>
    </section>

    <section class="field" id="accentField">
      <span class="field-label">Accent</span>
      <div class="swatches" id="accentSwatches" role="radiogroup" aria-label="Accent colour"></div>
    </section>

    <section class="field" id="fontField">
      <span class="field-label">Typeface</span>
      <div class="choices" id="fontChoices" role="radiogroup" aria-label="Typeface"></div>
    </section>

    <button class="reset" id="resetButton">Reset to defaults</button>
  </aside>

  <script type="module" src="js/main.js"></script>
</body>
</html>
